services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DIFF_FUSE_ENVIRONMENT: prod
      # Redis keeps sessions across backend restarts, unlike the in-memory default.
      DIFF_FUSE_SESSION_BACKEND: redis
      DIFF_FUSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DIFF_FUSE_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
