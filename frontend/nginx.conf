server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sessions can hold several documents of up to ~1 MB each.
    client_max_body_size 16m;

    # The trailing slashes strip the prefix: /api/{id}/diff -> backend /{id}/diff
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change, so let browsers keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes such as /s/:sessionId fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
